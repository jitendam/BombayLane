<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Orders</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/components.css"></head>
<body>
  <script>
    const _au = JSON.parse(localStorage.getItem('bl_user') || '{}');
    if (!localStorage.getItem('bl_token') || _au.role !== 'admin') { window.location.href = '/pages/auth.html'; }
  </script>
  <header class="topbar"><a class="brand" href="/admin/index.html">Admin</a></header>
  <main class="container">
    <nav class="nav-links" style="margin-bottom:1rem"><a href="/admin/restaurants.html">Restaurants</a><a href="/admin/users.html">Users</a></nav>
    <section class="card">
      <h1>Order Monitoring</h1>
      <div id="orders-table"><div class="spinner" aria-label="Loading"></div></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/js/utils.js"></script>
  <script>
    const STATUS_OPTIONS = ['placed','confirmed','preparing','out_for_delivery','delivered','cancelled'];

    async function updateStatus(orderId, status) {
      try {
        await BombayLane.api.request(`/api/orders/${orderId}/status`, {
          method: 'PUT',
          body: JSON.stringify({ status })
        });
        BombayLane.notify('Status updated');
        loadOrders();
      } catch (err) {
        BombayLane.notify(err.message);
      }
    }

    async function loadOrders() {
      const root = document.getElementById('orders-table');
      try {
        const result = await BombayLane.api.request('/api/orders');
        const orders = result.orders || [];
        if (!orders.length) { root.innerHTML = '<p class="muted">No orders found.</p>'; return; }

        root.innerHTML = `<table style="width:100%;border-collapse:collapse">
          <thead><tr style="text-align:left;border-bottom:1px solid var(--border)">
            <th style="padding:.5rem">ID</th><th style="padding:.5rem">Customer</th>
            <th style="padding:.5rem">Total</th><th style="padding:.5rem">Status</th><th style="padding:.5rem">Action</th>
          </tr></thead>
          <tbody>${orders.map((o) => `
            <tr style="border-bottom:1px solid var(--border)">
              <td style="padding:.5rem;font-family:monospace">#${BombayLane.escapeHtml(o._id.slice(-6))}</td>
              <td style="padding:.5rem">${BombayLane.escapeHtml(o.customer || '-')}</td>
              <td style="padding:.5rem">₹${Number(o.total||0).toFixed(2)}</td>
              <td style="padding:.5rem"><span class="badge">${BombayLane.escapeHtml(o.status)}</span></td>
              <td style="padding:.5rem">
                <select onchange="updateStatus('${BombayLane.escapeAttr(o._id)}', this.value)" class="admin-select">
                  ${STATUS_OPTIONS.map((s) => `<option value="${s}"${s===o.status?' selected':''}>${s}</option>`).join('')}
                </select>
              </td>
            </tr>`).join('')}
          </tbody></table>`;
      } catch (err) {
        root.innerHTML = `<p class="muted">${err.message}</p>`;
      }
    }

    loadOrders();
  </script>
</body></html>
