<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | BombayLane</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/index.html">BombayLane</a>
    <nav class="nav-links">
      <a href="/index.html">← Site</a>
      <a href="/admin/index.html" class="active">Dashboard</a>
    </nav>
    <div class="nav-auth" id="nav-auth"></div>
  </header>

  <main class="container page-wrap">
    <!-- Auth gate -->
    <div id="admin-gate" class="card hidden" style="text-align:center;padding:3rem">
      <div style="font-size:3rem;margin-bottom:1rem">🔒</div>
      <h2>Admin access only</h2>
      <a class="btn btn-primary" href="/pages/auth.html" style="margin-top:1rem">Login</a>
    </div>

    <div id="admin-content" class="hidden">
      <h1 class="section-title" style="margin-bottom:1.5rem">Admin <span>Dashboard</span></h1>

      <!-- Stats -->
      <div class="grid cols-4" style="margin-bottom:2rem" id="stats-grid">
        <div class="card stat-card"><div class="stat-val" id="stat-users">–</div><div class="stat-lbl">Total Users</div></div>
        <div class="card stat-card"><div class="stat-val" id="stat-restaurants">–</div><div class="stat-lbl">Restaurants</div></div>
        <div class="card stat-card"><div class="stat-val" id="stat-orders">–</div><div class="stat-lbl">Total Orders</div></div>
        <div class="card stat-card"><div class="stat-val" id="stat-revenue">–</div><div class="stat-lbl">Revenue (₹)</div></div>
      </div>

      <!-- Tabs -->
      <div class="flex" style="margin-bottom:1rem;gap:.5rem">
        <button class="btn btn-primary btn-sm" id="tab-orders" onclick="showTab('orders')">Orders</button>
        <button class="btn btn-secondary btn-sm" id="tab-users"  onclick="showTab('users')">Users</button>
        <button class="btn btn-secondary btn-sm" id="tab-restaurants" onclick="showTab('restaurants')">Restaurants</button>
      </div>

      <!-- Orders tab -->
      <div id="panel-orders">
        <div class="loading-overlay" id="orders-loading"><div class="spinner"></div></div>
        <div id="orders-table" class="stack" style="gap:.75rem"></div>
      </div>

      <!-- Users tab -->
      <div id="panel-users" class="hidden">
        <div class="loading-overlay" id="users-loading" style="display:none"><div class="spinner"></div></div>
        <div id="users-table" class="stack" style="gap:.75rem"></div>
      </div>

      <!-- Restaurants tab -->
      <div id="panel-restaurants" class="hidden">
        <div class="loading-overlay" id="restaurants-loading" style="display:none"><div class="spinner"></div></div>
        <div id="restaurants-table" class="grid cols-auto" style="gap:.75rem"></div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/js/utils.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    const token = localStorage.getItem('bl_token');
    const user  = JSON.parse(localStorage.getItem('bl_user') || 'null');

    if (!token || user?.role !== 'admin') {
      document.getElementById('admin-gate').classList.remove('hidden');
    } else {
      document.getElementById('admin-content').classList.remove('hidden');
      init();
    }

    function showTab(tab) {
      ['orders','users','restaurants'].forEach((t) => {
        document.getElementById('panel-'+t).classList.toggle('hidden', t !== tab);
        document.getElementById('tab-'+t).className = 'btn btn-sm ' + (t === tab ? 'btn-primary' : 'btn-secondary');
      });
    }

    function statusBadge(s) {
      return `<span class="badge badge-${s}" style="text-transform:capitalize">${s.replace(/_/g,' ')}</span>`;
    }

    async function init() {
      // Stats
      try {
        const res = await BombayLane.api.request('/api/admin/stats');
        const s = res.stats;
        document.getElementById('stat-users').textContent        = s.users;
        document.getElementById('stat-restaurants').textContent  = s.restaurants;
        document.getElementById('stat-orders').textContent       = s.orders;
        document.getElementById('stat-revenue').textContent      = '₹' + Number(s.revenue || 0).toFixed(0);
      } catch(e) { BombayLane.notify(e.message); }

      // Orders
      try {
        const res = await BombayLane.api.request('/api/orders');
        document.getElementById('orders-loading').style.display = 'none';
        const orders = res.orders || [];
        const table  = document.getElementById('orders-table');
        if (!orders.length) { table.innerHTML = '<p class="muted card">No orders yet.</p>'; }
        else {
          table.innerHTML = orders.map((o) => `
            <div class="card">
              <div class="row" style="flex-wrap:wrap;gap:.5rem">
                <div>
                  <strong>#${o.id.slice(-8)}</strong>
                  <span class="small muted"> · ${BombayLane.escapeHtml(o.customerName || o.customer || '')} · ${BombayLane.escapeHtml(o.restaurantName || o.restaurant || '')}</span>
                </div>
                <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
                  ${statusBadge(o.status)}
                  <strong style="color:var(--brand)">₹${Number(o.total).toFixed(0)}</strong>
                  <span class="small muted">${new Date(o.createdAt).toLocaleDateString()}</span>
                </div>
              </div>
              <div style="margin-top:.5rem">
                <select class="input" style="width:auto;padding:.3rem .6rem;font-size:.8rem" onchange="updateStatus('${BombayLane.escapeAttr(o.id)}',this.value)">
                  ${['placed','confirmed','preparing','out_for_delivery','delivered','cancelled'].map((s) => `<option value="${s}" ${s===o.status?'selected':''}>${s.replace(/_/g,' ')}</option>`).join('')}
                </select>
              </div>
            </div>`).join('');
        }
      } catch(e) { document.getElementById('orders-loading').style.display='none'; BombayLane.notify(e.message); }
    }

    async function loadUsers() {
      const el = document.getElementById('users-table');
      const loading = document.getElementById('users-loading');
      if (el.innerHTML) return;
      loading.style.display = 'flex';
      try {
        const res = await BombayLane.api.request('/api/admin/users');
        loading.style.display = 'none';
        el.innerHTML = (res.users || []).map((u) => `
          <div class="card flex" style="gap:1rem">
            <div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#f97316);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800">${(u.name||'U')[0].toUpperCase()}</div>
            <div style="flex:1">
              <strong>${BombayLane.escapeHtml(u.name)}</strong>
              <p class="small muted" style="margin:0">${BombayLane.escapeHtml(u.email)}</p>
            </div>
            <span class="badge badge-open">${BombayLane.escapeHtml(u.role.replace('_',' '))}</span>
          </div>`).join('');
      } catch(e) { loading.style.display='none'; BombayLane.notify(e.message); }
    }

    async function loadRestaurants() {
      const el = document.getElementById('restaurants-table');
      const loading = document.getElementById('restaurants-loading');
      if (el.innerHTML) return;
      loading.style.display = 'flex';
      try {
        const res = await BombayLane.api.request('/api/restaurants');
        loading.style.display = 'none';
        el.innerHTML = (res.restaurants || []).map((r) => `
          <div class="card restaurant-card card-hover" onclick="location.href='/pages/restaurant-detail.html?id=${encodeURIComponent(r.id)}'">
            <img src="https://picsum.photos/seed/${BombayLane.escapeAttr(r.id)}/400/200" alt="${BombayLane.escapeAttr(r.name)}" loading="lazy">
            <div class="rc-body">
              <h3>${BombayLane.escapeHtml(r.name)}</h3>
              <div class="rc-meta"><span class="rating">★ ${Number(r.averageRating||0).toFixed(1)}</span><span>${BombayLane.escapeHtml(r.location?.city||'')}</span></div>
            </div>
          </div>`).join('');
      } catch(e) { loading.style.display='none'; BombayLane.notify(e.message); }
    }

    // Load data when tabs are switched
    document.getElementById('tab-users').addEventListener('click', loadUsers);
    document.getElementById('tab-restaurants').addEventListener('click', loadRestaurants);

    async function updateStatus(orderId, status) {
      try {
        await BombayLane.api.request(`/api/orders/${orderId}/status`, {
          method: 'PUT',
          body: JSON.stringify({ status })
        });
        BombayLane.notify('Status updated to ' + status);
      } catch(e) { BombayLane.notify(e.message); }
    }
  </script>
</body>
</html>
