<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BombayLane | Authentic Indian Cuisine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1 class="logo">Bombay<span>Lane</span></h1>
    <button class="cart-btn">🛒 Cart (<span id="cart-count">2</span>)</button>
  </header>

  <main class="menu-container">
    <article class="menu-card">
      <div class="menu-card__image" style="background-color: #ddd; height: 150px;"></div>
      <div class="menu-card__content">
        <h2>Butter Chicken Bowl</h2>
        <p>Grilled cottage cheese cubes in a spiced onion-tomato gravy. Served with 2 Naans.</p>
        <div class="menu-card__footer">
          <span class="price">₹250</span>
          <button class="add-to-cart-btn" onclick="orderManager.processOrder()">Add to Cart</button>
        </div>
      </div>
    </article>
  </main>

  <dialog id="order-dialog" class="dialog">
    <div class="dialog__content">
      <h3 class="dialog__title">Order Confirmed!</h3>
      <p class="dialog__text">Thank you for ordering with BombayLane! Your food is being prepared.</p>
      <button id="dialog-close-btn" class="dialog__btn">OK</button>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
