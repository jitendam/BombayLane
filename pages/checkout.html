<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | BombayLane</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <script>if (!localStorage.getItem('bl_token')) { window.location.href = '/pages/auth.html'; }</script>
  <header class="topbar">
    <a class="brand" href="/index.html">BombayLane</a>
    <nav class="nav-links">
      <a href="/pages/restaurants.html">Restaurants</a>
      <a href="/pages/orders.html">Orders</a>
      <a href="/pages/cart.html">Cart <span id="cart-count" class="pill">0</span></a>
    </nav>
  </header>
  <main class="container">
    <section class="card">
      <h1>Checkout</h1>
      <div class="form-grid">
        <div>
          <label class="label" for="delivery-address">Delivery Address</label>
          <textarea id="delivery-address" class="input" rows="3" placeholder="Enter your delivery address"></textarea>
        </div>
        <div>
          <h2 style="margin:0 0 .5rem">Your Items</h2>
          <ul id="cart-items" class="list"></ul>
        </div>
        <div id="cart-summary" class="card"></div>
        <button id="place-order-btn" class="btn" onclick="BombayLane.orders.placeOrder()">Place Order</button>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/js/utils.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/orders.js"></script>
  <script src="/js/main.js"></script>
  <script>
    // Pre-fill address from stored user profile
    const _u = BombayLane.currentUser();
    if (_u.address) document.getElementById('delivery-address').value = _u.address;
    BombayLane.cart.render('cart-items', 'cart-summary');
  </script>
</body>
</html>
