<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | BombayLane</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="/index.html">BombayLane</a><button id="theme-toggle" class="btn btn-secondary">Dark mode</button></header>
  <main class="container">
    <section class="card">
      <h1>My Profile</h1>
      <pre id="profile-data" class="muted"></pre>
    </section>
  </main>
  <script src="/js/main.js"></script>
  <script>
    const user = JSON.parse(localStorage.getItem('bl_user') || '{}');
    document.getElementById('profile-data').textContent = JSON.stringify(user, null, 2) || 'No user logged in';
  </script>
</body>
</html>
