<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | BombayLane</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/index.html">BombayLane</a>
    <nav class="nav-links">
      <a href="/pages/restaurants.html">Restaurants</a>
      <a href="/pages/orders.html">My Orders</a>
      <a href="/pages/cart.html">Cart <span id="cart-count" class="pill">0</span></a>
    </nav>
    <div class="nav-auth" id="nav-auth"></div>
  </header>

  <main class="container-sm page-wrap">
    <div id="not-logged" class="card hidden" style="text-align:center;padding:3rem">
      <div style="font-size:3rem;margin-bottom:1rem">🔒</div>
      <h2>Please login to view your profile</h2>
      <a class="btn btn-primary" href="/pages/auth.html" style="margin-top:1rem">Login</a>
    </div>

    <div id="profile-content" class="hidden">
      <div class="card" style="margin-bottom:1.25rem;display:flex;gap:1rem;align-items:center">
        <div style="width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#f97316);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.5rem;font-weight:800" id="avatar"></div>
        <div>
          <h2 id="profile-name"></h2>
          <span class="badge badge-open" id="profile-role" style="margin-top:.25rem"></span>
        </div>
      </div>

      <div class="card">
        <h2 style="margin-bottom:1rem">Edit Profile</h2>
        <form id="profile-form" class="form-group">
          <div>
            <label class="label">Full Name</label>
            <input class="input" id="f-name" type="text" placeholder="Your name">
          </div>
          <div>
            <label class="label">Email <span class="small muted">(cannot change)</span></label>
            <input class="input" id="f-email" type="email" disabled style="opacity:.6">
          </div>
          <div>
            <label class="label">Phone</label>
            <input class="input" id="f-phone" type="tel" placeholder="+91 9000 000 000">
          </div>
          <div>
            <label class="label">Default Delivery Address</label>
            <textarea class="input" id="f-address" rows="3" placeholder="Your address"></textarea>
          </div>
          <button class="btn btn-primary" type="submit" id="save-btn">Save Changes</button>
        </form>
      </div>

      <div class="card" style="margin-top:1.25rem">
        <div class="row">
          <div><h3>Order History</h3><p class="small muted" id="order-count"></p></div>
          <a href="/pages/orders.html" class="btn btn-secondary btn-sm">View All →</a>
        </div>
      </div>

      <div style="margin-top:1.25rem;text-align:right">
        <button class="btn btn-danger" onclick="logout()">Logout</button>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/js/utils.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    BombayLane.cart.updateCount();
    const token = localStorage.getItem('bl_token');
    const user  = JSON.parse(localStorage.getItem('bl_user') || 'null');

    if (!token || !user) {
      document.getElementById('not-logged').classList.remove('hidden');
    } else {
      document.getElementById('profile-content').classList.remove('hidden');
      document.getElementById('avatar').textContent = (user.name || 'U')[0].toUpperCase();
      document.getElementById('profile-name').textContent = user.name;
      document.getElementById('profile-role').textContent = user.role.replace('_', ' ');
      document.getElementById('f-name').value    = user.name || '';
      document.getElementById('f-email').value   = user.email || '';
      document.getElementById('f-phone').value   = user.phone || '';
      document.getElementById('f-address').value = user.address || '';

      // Load order count
      BombayLane.api.request('/api/orders').then((res) => {
        document.getElementById('order-count').textContent = `${res.orders?.length || 0} orders placed`;
      }).catch(() => {});
    }

    document.getElementById('profile-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('save-btn');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        const res = await BombayLane.api.request('/api/auth/profile', {
          method: 'PUT',
          body: JSON.stringify({
            name:    document.getElementById('f-name').value.trim(),
            phone:   document.getElementById('f-phone').value.trim(),
            address: document.getElementById('f-address').value.trim()
          })
        });
        localStorage.setItem('bl_user', JSON.stringify(res.user));
        document.getElementById('profile-name').textContent = res.user.name;
        document.getElementById('avatar').textContent = (res.user.name || 'U')[0].toUpperCase();
        BombayLane.notify('Profile updated!');
      } catch (err) {
        BombayLane.notify(err.message);
      }
      btn.disabled = false; btn.textContent = 'Save Changes';
    });

    function logout() {
      localStorage.removeItem('bl_token');
      localStorage.removeItem('bl_user');
      BombayLane.notify('Logged out');
      setTimeout(() => location.href = '/index.html', 600);
    }
  </script>
</body>
</html>
