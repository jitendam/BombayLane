<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth | BombayLane</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="/index.html">BombayLane</a></header>
  <main class="container grid cols-3" style="grid-template-columns:1fr 1fr;">
    <section class="card">
      <h1>Login</h1>
      <form id="login-form" class="form-grid" novalidate>
        <input class="input" type="email" name="email" placeholder="Email" required>
        <input class="input" type="password" name="password" placeholder="Password" required>
        <button class="btn" type="submit">Login</button>
      </form>
      <div style="margin-top:1rem;display:flex;align-items:center;gap:.5rem">
        <hr style="flex:1;border:none;border-top:1px solid var(--border)">
        <span style="font-size:.8rem;color:#6b7280">or</span>
        <hr style="flex:1;border:none;border-top:1px solid var(--border)">
      </div>
      <a href="/api/auth/github" class="btn btn-secondary" style="margin-top:.75rem;width:100%;justify-content:center;text-decoration:none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
        Login with GitHub
      </a>
    </section>
    <section class="card">
      <h1>Register</h1>
      <form id="register-form" class="form-grid" novalidate>
        <input class="input" type="text" name="name" placeholder="Name" minlength="2" required>
        <input class="input" type="email" name="email" placeholder="Email" required>
        <input class="input" type="password" name="password" placeholder="Password" required>
        <select name="role"><option value="customer">Customer</option><option value="restaurant_owner">Restaurant Owner</option></select>
        <input class="input" type="text" name="phone" placeholder="Phone">
        <textarea class="input" name="address" placeholder="Address"></textarea>
        <button class="btn" type="submit">Create account</button>
      </form>
      <button id="logout-btn" class="btn btn-secondary" style="margin-top:1rem">Logout</button>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script>BombayLane.auth.init();</script>
</body>
</html>
