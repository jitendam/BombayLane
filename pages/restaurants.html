<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurants | BombayLane</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/index.html">BombayLane</a>
    <nav class="nav-links"><a href="/pages/cart.html">Cart <span id="cart-count" class="pill">0</span></a></nav>
  </header>
  <main class="container">
    <section class="card form-grid">
      <h1>Find restaurants</h1>
      <input id="search-input" class="input" type="search" placeholder="Search by name, cuisine, or city">
      <select id="cuisine-filter">
        <option value="">All cuisines</option>
        <option value="North Indian">North Indian</option>
        <option value="South Indian">South Indian</option>
        <option value="Street Food">Street Food</option>
        <option value="Mughlai">Mughlai</option>
      </select>
    </section>
    <section id="restaurant-list" class="grid cols-3" aria-live="polite"></section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/js/utils.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/restaurant.js"></script>
  <script src="/js/main.js"></script>
  <script>BombayLane.restaurants.init();</script>
</body>
</html>
