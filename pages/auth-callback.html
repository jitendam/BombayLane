<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing in… | BombayLane</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .callback-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 1rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 4px solid #e5e7eb;
      border-top-color: var(--brand, #f97316);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="/index.html">BombayLane</a></header>
  <main class="container">
    <div class="callback-wrap">
      <div class="spinner" aria-hidden="true"></div>
      <p id="status-msg">Completing GitHub login…</p>
    </div>
  </main>
  <script>
    (async () => {
      const msg = document.getElementById('status-msg');

      // Supabase returns the access token in the URL hash after OAuth redirect
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      const accessToken = params.get('access_token');
      const errorDesc = params.get('error_description') || params.get('error');

      if (errorDesc) {
        msg.textContent = 'GitHub login failed: ' + errorDesc;
        return;
      }

      if (!accessToken) {
        msg.textContent = 'No access token received. Please try again.';
        setTimeout(() => { window.location.href = '/pages/auth.html'; }, 2500);
        return;
      }

      try {
        const resp = await fetch('/api/auth/github/exchange', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ access_token: accessToken })
        });
        const data = await resp.json();

        if (!resp.ok || !data.success) {
          msg.textContent = data.message || 'Login failed. Please try again.';
          setTimeout(() => { window.location.href = '/pages/auth.html'; }, 2500);
          return;
        }

        localStorage.setItem('bl_token', data.token);
        localStorage.setItem('bl_user', JSON.stringify(data.user));
        msg.textContent = 'Logged in! Redirecting…';
        window.location.href = '/pages/restaurants.html';
      } catch (err) {
        msg.textContent = 'An error occurred. Please try again.';
        setTimeout(() => { window.location.href = '/pages/auth.html'; }, 2500);
      }
    })();
  </script>
</body>
</html>
